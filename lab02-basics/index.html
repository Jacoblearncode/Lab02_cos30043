<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 02 - Bootstrap Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    /* Helper style to visualise grid columns */
    .grid-demo {
      background-color: #e7f1ff;
      border: 1px solid #b6d4fe;
      padding: 12px;
      margin-bottom: 10px;
      text-align: center;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Part 2: Understanding Containers, Rows, and Columns -->
  <div class="container">
    <h2>Basic Grid</h2>

    <!-- col-6 + col-6 = 6/12 + 6/12 -> exact half/half split -->
    <div class="row">
      <div class="col-6">
        <div class="grid-demo">col-6</div>
      </div>
      <div class="col-6">
        <div class="grid-demo">col-6</div>
      </div>
    </div>

    <!-- col-4 x3 = 4/12 each -> three equal columns -->
    <div class="row">
      <div class="col-4">
        <div class="grid-demo">col-4</div>
      </div>
      <div class="col-4">
        <div class="grid-demo">col-4</div>
      </div>
      <div class="col-4">
        <div class="grid-demo">col-4</div>
      </div>
    </div>

    <!-- col-3 + col-9 = 3/12 + 9/12 -> uneven split, still fills the 12-column row -->
    <div class="row">
      <div class="col-3">
        <div class="grid-demo">col-3</div>
      </div>
      <div class="col-9">
        <div class="grid-demo">col-9</div>
      </div>
    </div>

    <!-- col (no number) = auto-width -> Bootstrap splits remaining space evenly -->
    <div class="row">
      <div class="col">
        <div class="grid-demo">col (auto)</div>
      </div>
      <div class="col">
        <div class="grid-demo">col (auto)</div>
      </div>
      <div class="col">
        <div class="grid-demo">col (auto)</div>
      </div>
    </div>
  </div>

  <!-- Part 3: Responsive Breakpoints -->
  <!-- col-12 col-md-6 col-lg-4:                                 -->
  <!--   < 768px  -> col-12   -> full width, stacked (1 per row) -->
  <!--   >= 768px -> col-md-6 -> half width (2 per row)          -->
  <!--   >= 992px -> col-lg-4 -> one third width (3 per row)     -->
  <div class="container my-4">
    <h2>Responsive Breakpoints</h2>
    <div class="row">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="grid-demo">col-12 col-md-6 col-lg-4</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="grid-demo">col-12 col-md-6 col-lg-4</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="grid-demo">col-12 col-md-6 col-lg-4</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
